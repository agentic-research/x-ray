<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Ray Voice</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 2rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #aaa; font-weight: 400; }
  .controls { display: flex; gap: 1rem; align-items: center; }
  button {
    border: none; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  #disconnect-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: #222; color: #666; font-size: 1rem;
    display: none;
  }
  #disconnect-btn:hover { background: #4a1a1a; color: #e74c3c; }
  #mic-btn {
    width: 96px; height: 96px; border-radius: 50%;
    background: #1a1a1a; color: #444; font-size: 2.5rem;
    user-select: none; -webkit-user-select: none;
  }
  #mic-btn.ready { background: #222; color: #888; }
  #mic-btn.ready:hover { background: #333; }
  #mic-btn.recording { background: #c0392b; color: #fff; animation: pulse 1.5s infinite; }
  #mic-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
    50% { box-shadow: 0 0 0 16px rgba(192,57,43,0); }
  }
  #status { margin-top: 1rem; font-size: 0.85rem; color: #666; min-height: 1.2em; }
  #transcript {
    margin-top: 2rem; width: 100%; max-width: 600px;
    max-height: 50vh; overflow-y: auto; font-size: 0.9rem; line-height: 1.6;
  }
  .user-line { color: #5dade2; }
  .model-line { color: #abebc6; }
  .action-line { color: #f5b041; font-style: italic; }
  .system-line { color: #666; font-size: 0.8rem; }
</style>
</head>
<body>

<h1>X-Ray Voice Navigator</h1>
<div class="controls">
  <button id="mic-btn" disabled title="Hold to talk">&#x1F3A4;</button>
  <button id="disconnect-btn" title="Disconnect">&#x2716;</button>
</div>
<div id="status">Connecting...</div>
<div id="transcript"></div>

<script>
const disconnectBtn = document.getElementById('disconnect-btn');
const micBtn = document.getElementById('mic-btn');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');

const INPUT_RATE = 16000;
const OUTPUT_RATE = 24000;

// Resolve WS URL: works whether served from agentd or opened directly.
const HOST = location.host || 'localhost:8080';
const WS_URL = `ws://${HOST}/voice`;

let ws = null;
let audioCtx = null;
let mediaStream = null;
let micCtx = null;
let processor = null;
let connected = false;
let sessionReady = false;
let recording = false;

function addLine(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

// --- Audio playback ---
let playQueue = [];
let playing = false;

function enqueueAudio(pcmBytes) {
  playQueue.push(pcmBytes);
  if (!playing) drainQueue();
}

function drainQueue() {
  if (playQueue.length === 0) { playing = false; return; }
  playing = true;
  const raw = playQueue.shift();
  const samples = new Int16Array(raw.buffer, raw.byteOffset, raw.byteLength / 2);
  const floats = new Float32Array(samples.length);
  for (let i = 0; i < samples.length; i++) floats[i] = samples[i] / 32768;

  if (!audioCtx) audioCtx = new AudioContext({ sampleRate: OUTPUT_RATE });
  const buf = audioCtx.createBuffer(1, floats.length, OUTPUT_RATE);
  buf.copyToChannel(floats, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.onended = drainQueue;
  src.start();
}

// --- Mic capture (acquired once on connect, gated by `recording` flag) ---
async function acquireMic() {
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: {
    sampleRate: 48000, channelCount: 1, echoCancellation: true, noiseSuppression: true,
  }});
  micCtx = new AudioContext({ sampleRate: 48000 });
  const source = micCtx.createMediaStreamSource(mediaStream);

  processor = micCtx.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const ratio = 48000 / INPUT_RATE;
    const out = new Int16Array(Math.floor(input.length / ratio));
    for (let i = 0; i < out.length; i++) {
      const s = Math.max(-1, Math.min(1, input[Math.round(i * ratio)]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    ws.send(out.buffer);
  };
  source.connect(processor);
  processor.connect(micCtx.destination);
}

function releaseMic() {
  if (processor) { processor.disconnect(); processor = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}

// --- WebSocket session (auto-connects on page load) ---
function connect() {
  statusEl.textContent = 'Connecting...';
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    connected = true;
    disconnectBtn.style.display = 'flex';
    statusEl.textContent = 'Connected - waiting for Gemini session...';
    await acquireMic();
  };

  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      enqueueAudio(new Uint8Array(e.data));
      return;
    }
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'waiting':
        statusEl.textContent = msg.text;
        break;
      case 'schema_ready':
        statusEl.textContent = msg.text;
        break;
      case 'ready':
        sessionReady = true;
        micBtn.disabled = false;
        micBtn.classList.add('ready');
        statusEl.textContent = 'Session ready - hold mic to talk (or spacebar)';
        break;
      case 'input_transcription':
        addLine('user-line', 'You: ' + msg.text);
        break;
      case 'output_transcription':
        addLine('model-line', 'Navigator: ' + msg.text);
        break;
      case 'model_text':
        addLine('model-line', 'Navigator: ' + msg.text);
        break;
      case 'EXECUTE_ACTION':
        addLine('action-line', `Action: ${msg.action} on ${msg.mache_id}`);
        break;
      case 'interrupted':
        addLine('system-line', '(interrupted)');
        break;
      case 'turn_complete':
        if (sessionReady) statusEl.textContent = 'Hold mic to talk';
        break;
      case 'error':
        addLine('system-line', 'Error: ' + msg.text);
        statusEl.textContent = 'Error';
        break;
    }
  };

  ws.onclose = () => {
    statusEl.textContent = 'Disconnected - refresh to reconnect';
    releaseMic();
    connected = false;
    sessionReady = false;
    recording = false;
    disconnectBtn.style.display = 'none';
    micBtn.disabled = true;
    micBtn.classList.remove('ready', 'recording');
  };

  ws.onerror = (e) => {
    console.error('Voice WS error', e);
    statusEl.textContent = 'Connection failed - is agentd running on ' + HOST + '?';
  };
}

function disconnect() {
  releaseMic();
  if (ws) { ws.close(); ws = null; }
}

// Disconnect button
disconnectBtn.addEventListener('click', disconnect);

// --- Mic button: push-to-talk (hold to record) ---
function startRecording() {
  if (!sessionReady) return;
  recording = true;
  micBtn.classList.remove('ready');
  micBtn.classList.add('recording');
  statusEl.textContent = 'Recording...';
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove('recording');
  micBtn.classList.add('ready');
  statusEl.textContent = 'Processing...';
  // Signal server to send AudioStreamEnd to Gemini.
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'mic_stop' }));
  }
}

// Mouse
micBtn.addEventListener('mousedown', startRecording);
micBtn.addEventListener('mouseup', stopRecording);
micBtn.addEventListener('mouseleave', stopRecording);

// Touch (mobile)
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
micBtn.addEventListener('touchcancel', stopRecording);

// Spacebar as PTT shortcut
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && sessionReady) { e.preventDefault(); startRecording(); }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { e.preventDefault(); stopRecording(); }
});

// --- Auto-connect on page load ---
connect();
</script>
</body>
</html>
