<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    padding: 16px;
  }
  .header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 13px; color: #888; font-weight: 500;
    letter-spacing: 0.5px; flex-shrink: 0;
  }
  #status {
    font-size: 11px; color: #555;
    line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.connected { color: #4a8a4a; }
  #status.error { color: #8a4a4a; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .btn {
    display: block;
    padding: 8px 0;
    border: 1px solid #333; border-radius: 6px;
    background: #222; color: #ccc;
    font-size: 12px; cursor: pointer;
    text-align: center; transition: all 0.15s;
  }
  .btn:hover { background: #2a2a2a; border-color: #555; color: #fff; }
  .btn:active { background: #333; }
  .btn.accent { color: #4a8a4a; }
  .intent-row {
    display: flex; gap: 4px;
  }
  .intent-row input {
    flex: 1; padding: 8px 10px;
    border: 1px solid #333; border-radius: 6px;
    background: #222; color: #ccc;
    font-size: 12px; outline: none;
    min-width: 0;
  }
  .intent-row input:focus { border-color: #555; }
  .intent-row input::placeholder { color: #555; }
  .intent-row .btn { width: 40px; flex-shrink: 0; padding: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>X-RAY</h1>
  <div id="status">Checking...</div>
</div>
<div class="grid">
  <button id="snapshot-btn" class="btn" title="Capture page snapshot">Snapshot</button>
  <button id="overlay-btn" class="btn" title="Toggle Set-of-Mark overlay (Cmd+Shift+O)">Overlay</button>
  <button id="export-btn" class="btn" title="Export Set-of-Mark overlay as PNG">Export</button>
  <button id="log-btn" class="btn accent" title="Open agent log panel">Log</button>
</div>
<div class="intent-row">
  <input id="intent-input" type="text" placeholder="Command or Enter to talk...">
  <button id="intent-btn" class="btn">Go</button>
</div>

<script src="popup.js"></script>
</body>
</html>
