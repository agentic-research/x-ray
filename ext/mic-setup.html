<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>X-Ray — Mic Permission</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; padding: 24px;
  }
  .card {
    text-align: center; max-width: 340px;
  }
  h1 { font-size: 14px; color: #888; font-weight: 500; letter-spacing: 0.5px; margin-bottom: 16px; }
  p { font-size: 13px; color: #999; line-height: 1.5; margin-bottom: 20px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    border: 1px solid #333; border-radius: 6px;
    background: #222; color: #ccc;
    font-size: 14px; cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: #2a2a2a; border-color: #555; color: #fff; }
  .btn:active { background: #333; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  #status {
    font-size: 12px; color: #555; margin-top: 16px;
    min-height: 16px; line-height: 1.4;
  }
  #status.error { color: #8a4a4a; }
  #status.ok { color: #4a8a4a; }
</style>
</head>
<body>
<div class="card">
  <h1>X-RAY</h1>
  <p>Chrome needs your permission to use the microphone for voice commands. Click below to allow access.</p>
  <button id="grant-btn" class="btn">Grant Mic Access</button>
  <div id="status"></div>
</div>
<script src="mic-setup.js"></script>
</body>
</html>
