version: '3'

vars:
  BINARY_NAME: bin/agentd
  # fuse-t configuration for macOS
  FUSE_T_HEADERS: /Library/Frameworks/fuse_t.framework/Versions/Current/Headers
  FUSE_T_FRAMEWORK: /Library/Frameworks

env:
  # Set CGO flags for fuse-t on macOS (no-op on other platforms)
  CGO_CFLAGS: '{{if eq OS "darwin"}}-I{{.FUSE_T_HEADERS}}{{end}}'
  CGO_LDFLAGS: '{{if eq OS "darwin"}}-F{{.FUSE_T_FRAMEWORK}} -framework fuse_t -Wl,-rpath,{{.FUSE_T_FRAMEWORK}}{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  check-fuse-t:
    desc: Check if fuse-t is installed (macOS only)
    silent: true
    cmds:
      - |
        if [ "$(uname)" = "Darwin" ]; then
          if [ ! -d "{{.FUSE_T_HEADERS}}" ]; then
            echo "❌ fuse-t not found. Run 'task setup' to install."
            exit 1
          else
            echo "✅ fuse-t found at {{.FUSE_T_HEADERS}}"
          fi
        else
          echo "ℹ️  fuse-t check skipped (not macOS)"
        fi

  setup:
    desc: Install system dependencies (e.g. fuse-t on macOS)
    cmds:
      - |
        if [ "$(uname)" = "Darwin" ]; then
          if [ ! -d "{{.FUSE_T_HEADERS}}" ]; then
            echo "Installing fuse-t via Homebrew..."
            brew install --cask fuse-t
          else
            echo "✅ fuse-t is already installed."
          fi
        fi

  deps:
    desc: Install all project dependencies
    cmds:
      - |
        echo "==> Go module dependencies"
        go mod download
        echo "    Done."
      - |
        echo "==> sox (needed for voice mode mic/speaker)"
        if command -v sox >/dev/null 2>&1; then
          echo "    sox already installed: $(sox --version 2>&1 | head -1)"
        else
          if [ "$(uname)" = "Darwin" ]; then
            echo "    Installing sox via Homebrew..."
            brew install sox
          else
            echo "    sox not found. Please install sox for your platform."
          fi
        fi
      - |
        echo "==> Ollama (optional, for local Navigator model)"
        if command -v ollama >/dev/null 2>&1; then
          echo "    ollama found: $(ollama --version 2>&1 | head -1)"
        else
          echo "    ollama not found. Install from https://ollama.com if you want local Navigator models."
        fi
      - |
        echo "==> fuse-t (needed for FUSE mount)"
        if [ "$(uname)" = "Darwin" ]; then
          if [ -d "{{.FUSE_T_HEADERS}}" ]; then
            echo "    fuse-t found at {{.FUSE_T_HEADERS}}"
          else
            echo "    fuse-t not found. Run 'brew install --cask fuse-t' to install."
          fi
        else
          echo "    fuse-t check skipped (not macOS)."
        fi

  build:
    desc: Build and codesign agentd
    deps: [check-fuse-t]
    cmds:
      - go build -o {{.BINARY_NAME}} ./cmd/agentd
      - cmd: codesign -s - --force --deep --entitlements entitlements.plist ./{{.BINARY_NAME}}
        platforms: [darwin]
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - entitlements.plist
    generates:
      - "{{.BINARY_NAME}}"

  run:
    desc: Build and run agentd
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}}

  stop:
    desc: Stop a running agentd process
    cmds:
      - |
        PID_FILE="$HOME/.xray/agentd.pid"
        if [ -f "$PID_FILE" ]; then
          PID=$(cat "$PID_FILE")
          if /bin/kill -0 "$PID" 2>/dev/null; then
            /bin/kill "$PID"
            echo "Sent SIGTERM to agentd (PID $PID)"
            for i in 1 2 3; do /bin/kill -0 "$PID" 2>/dev/null || break; sleep 1; done
            if /bin/kill -0 "$PID" 2>/dev/null; then /bin/kill -9 "$PID"; echo "Force-killed (PID $PID)"; fi
          else
            echo "PID $PID not running (stale PID file)"
          fi
          rm -f "$PID_FILE"
        else
          PID=$(lsof -i ":${XRAY_PORT:-8080}" -sTCP:LISTEN -t 2>/dev/null | head -1 || true)
          if [ -n "$PID" ]; then
            /bin/kill "$PID" && echo "Killed agentd on port ${XRAY_PORT:-8080} (PID $PID)"
          else
            echo "No agentd running"
          fi
        fi

  restart:
    desc: Stop then rebuild and run agentd
    cmds:
      - task: stop
      - task: run

  demo:
    desc: Build and run the voice demo (Talker/Doer swarm)
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}} --voice

  demo-tropical:
    desc: Build and run voice demo with tropical cartographer (algebraic, no VLM)
    deps: [build]
    env:
      CARTOGRAPHER_MODE: tropical
    cmds:
      - ./{{.BINARY_NAME}} --voice

  demo-cairn:
    desc: Build and run voice demo with cairn cartographer (Leech lattice, no VLM)
    deps: [build]
    env:
      CARTOGRAPHER_MODE: cairn
    cmds:
      - ./{{.BINARY_NAME}} --voice

  demo-fast:
    desc: Build and run fast voice demo (Gemini REST + Thinking, cairn, no continuation)
    deps: [build]
    env:
      CARTOGRAPHER_MODE: cairn
      NAV_SPEED: fast
      NAVIGATOR_ENDPOINT: ""
      NAVIGATOR_MODEL: ""
      NAVIGATOR_FORMAT: ""
    cmds:
      - ./{{.BINARY_NAME}} --voice

  demo-local:
    desc: Build and run fully air-gapped (local VLM + local SLM, no cloud API)
    deps: [build]
    env:
      CARTOGRAPHER_ENDPOINT: http://localhost:11434/v1
      CARTOGRAPHER_MODEL: '{{.CARTOGRAPHER_MODEL | default "llava:13b"}}'
      NAVIGATOR_ENDPOINT: http://localhost:11434/v1
      NAVIGATOR_MODEL: '{{.NAVIGATOR_MODEL | default "qwen2.5-coder:7b"}}'
      NAVIGATOR_FORMAT: openai
    cmds:
      - ./{{.BINARY_NAME}} --voice

  bench:
    desc: Run navigation accuracy benchmark (requires GEMINI_API_KEY)
    cmds:
      - go run ./cmd/bench

  bench-cairn:
    desc: Run bench with cairn cartographer + local Ollama navigator (no cloud API)
    env:
      CARTOGRAPHER_MODE: cairn
      NAVIGATOR_ENDPOINT: http://localhost:11434/v1
      NAVIGATOR_MODEL: '{{.NAVIGATOR_MODEL | default "qwen2.5-coder:7b"}}'
      NAVIGATOR_FORMAT: openai
    cmds:
      - go run ./cmd/bench

  bench-tropical:
    desc: Run bench with tropical cartographer (no VLM, still needs Gemini for nav)
    env:
      CARTOGRAPHER_MODE: tropical
    cmds:
      - go run ./cmd/bench

  nav-dump:
    desc: Dump what Navigator sees for each testdata site (no LLM needed, instant)
    env:
      CARTOGRAPHER_MODE: cairn
    cmds:
      - go run ./cmd/bench --dump {{.CLI_ARGS}}

  nav-test:
    desc: Run Navigator accuracy test with local Ollama SLM
    env:
      CARTOGRAPHER_MODE: cairn
      NAVIGATOR_ENDPOINT: http://localhost:11434/v1
      NAVIGATOR_MODEL: '{{.NAVIGATOR_MODEL | default "qwen3.5:9b"}}'
      NAVIGATOR_FORMAT: gemma
    cmds:
      - go run ./cmd/bench {{.CLI_ARGS}}

  nav-test-gemini:
    desc: Run Navigator accuracy test with Gemini Live API (requires GEMINI_API_KEY)
    env:
      CARTOGRAPHER_MODE: cairn
      NAVIGATOR_MODE: gemini-live
    cmds:
      - go run ./cmd/bench {{.CLI_ARGS}}

  gate:
    desc: Run the 48-hour gate test on the mock dummy page
    cmds:
      - go run ./cmd/gate

  gate-real:
    desc: Run the 48-hour gate test on all captured real pages
    cmds:
      - echo "Running gate test on Hacker News..."
      - go run ./cmd/gate testdata/hackernews/page.html testdata/hackernews/page.png
      - echo "Running gate test on GitHub..."
      - go run ./cmd/gate testdata/github/page.html testdata/github/page.png
      - echo "Running gate test on Wikipedia..."
      - go run ./cmd/gate testdata/wikipedia/page.html testdata/wikipedia/page.png
      - echo "Running gate test on Lobsters..."
      - go run ./cmd/gate testdata/lobsters/page.html testdata/lobsters/page.png
      - echo "Running gate test on eBay (Ecommerce)..."
      - go run ./cmd/gate testdata/ecommerce/page.html testdata/ecommerce/page.png

  webarena-setup:
    desc: Download WebArena Docker images (~30GB, run once)
    cmds:
      - bash scripts/webarena_setup.sh

  webarena-up:
    desc: Start WebArena Docker environment (6 sites via webarena-verified)
    cmds:
      - bash scripts/webarena_setup.sh

  webarena-down:
    desc: Stop all WebArena Docker containers
    cmds:
      - uvx webarena-verified env stop-all

  webarena:
    desc: Run WebArena evaluation (requires agentd + Chrome + Docker sites)
    deps: [check-fuse-t]
    cmds:
      - go run ./cmd/webarena

  webarena-hard:
    desc: Run WebArena-Verified hard subset (258 tasks) + score
    deps: [check-fuse-t]
    env:
      WEBARENA_SUBSET: hard
    cmds:
      - go run ./cmd/webarena
      - uv run scripts/webarena_eval.py results/webarena_latest/

  test:
    desc: Run all tests
    deps: [check-fuse-t]
    cmds:
      - go test -race -v ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code with gofumpt
    cmds:
      - gofumpt -w -extra .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  # ---------------------------------------------------------------------------
  # CF Browser Rendering
  # ---------------------------------------------------------------------------

  cf-install:
    desc: Install CF Worker dependencies
    dir: deploy/cf-worker
    cmds:
      - npm install

  cf-dev:
    desc: Run CF Browser Worker remotely (wrangler dev --remote)
    dir: deploy/cf-worker
    cmds:
      - npx wrangler dev --remote

  cf-deploy:
    desc: Deploy CF Browser Worker to Cloudflare
    dir: deploy/cf-worker
    cmds:
      - npx wrangler deploy

  cf-secret:
    desc: Set the API_TOKEN secret on the deployed CF Worker
    dir: deploy/cf-worker
    cmds:
      - npx wrangler secret put API_TOKEN

  cf-smoke:
    desc: Smoke-test the CF Worker (create session → summary → close)
    vars:
      CF_URL: '{{.CF_BROWSER_URL | default "http://localhost:8787"}}'
      CF_TOKEN: '{{.CF_BROWSER_TOKEN}}'
    cmds:
      - |
        set -euo pipefail
        URL="{{.CF_URL}}"
        TOKEN="{{.CF_TOKEN}}"
        CURL_ARGS=(-s --max-time 30)
        if [ -n "$TOKEN" ]; then
          CURL_ARGS+=(-H "Authorization: Bearer $TOKEN")
        fi

        echo "==> Creating session on $URL..."
        RESP=$(curl "${CURL_ARGS[@]}" -X POST "$URL/session" \
          -H "Content-Type: application/json" \
          -d '{"url":"https://example.com"}')
        echo "    Response: $RESP"
        if [ -z "$RESP" ]; then echo "    ERROR: empty response"; exit 1; fi

        SID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
        echo "    Session ID: $SID"

        echo "==> Requesting summary..."
        SUMMARY=$(curl "${CURL_ARGS[@]}" -X POST "$URL/session/$SID/summary" \
          -H "Content-Type: application/json" \
          -d '{}')
        echo "    ${SUMMARY:0:200}..."

        echo "==> Requesting screenshot..."
        SHOT=$(curl "${CURL_ARGS[@]}" -X POST "$URL/session/$SID/screenshot" \
          -H "Content-Type: application/json" \
          -d '{}')
        B64_LEN=$(echo "$SHOT" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('base64','')))")
        echo "    Screenshot base64 length: $B64_LEN"

        echo "==> Closing session..."
        curl "${CURL_ARGS[@]}" -X DELETE "$URL/session/$SID" | python3 -m json.tool
        echo "    Done."

  cf-run:
    desc: Run agentd with CF Browser backend
    deps: [build]
    env:
      CF_BROWSER_URL: '{{.CF_BROWSER_URL | default "http://localhost:8787"}}'
      CF_BROWSER_TOKEN: '{{.CF_BROWSER_TOKEN}}'
      WEBARENA_MODE: "1"
    cmds:
      - ./{{.BINARY_NAME}}

  cf-tunnel:
    desc: Start cloudflared quick tunnels for WebArena Docker services
    cmds:
      - bash scripts/cf_tunnel.sh

  cf-tunnel-stop:
    desc: Stop cloudflared tunnels
    cmds:
      - bash scripts/cf_tunnel.sh --stop

  cf-webarena:
    desc: Run WebArena eval via CF Browser backend (with tunnels)
    deps: [check-fuse-t]
    env:
      CF_BROWSER_URL: '{{.CF_BROWSER_URL | default "http://localhost:8787"}}'
      CF_BROWSER_TOKEN: '{{.CF_BROWSER_TOKEN}}'
      WEBARENA_MODE: "1"
    cmds:
      - |
        set -euo pipefail

        # Start tunnels and capture env vars.
        echo "==> Starting cloudflared tunnels..."
        eval "$(bash scripts/cf_tunnel.sh --env-only)"

        # Start agentd in background with tunnel URLs.
        go build -o bin/agentd ./cmd/agentd
        CF_BROWSER_URL="{{.CF_BROWSER_URL | default "http://localhost:8787"}}" \
        CF_BROWSER_TOKEN="{{.CF_BROWSER_TOKEN}}" \
        WEBARENA_MODE=1 \
          ./bin/agentd &
        AGENTD_PID=$!
        sleep 3

        # Run eval with tunnel URLs so start_urls point to tunnel.
        WEBARENA_SUBSET="${WEBARENA_SUBSET:-124}" \
          go run ./cmd/webarena || true

        # Cleanup
        kill "$AGENTD_PID" 2>/dev/null || true
        wait "$AGENTD_PID" 2>/dev/null || true
        bash scripts/cf_tunnel.sh --stop

  cf-compare:
    desc: Compare extension vs CF backend on same tasks
    cmds:
      - bash scripts/compare_backends.sh {{.CLI_ARGS | default "124"}}

  # ---------------------------------------------------------------------------
  # Demo
  # ---------------------------------------------------------------------------

  demo-video:
    desc: Voice demo for Devpost (Cairn + Gemini Live)
    deps: [build]
    env:
      CARTOGRAPHER_MODE: cairn
      CAIRN_SHEAF: "0"
      CAIRN_CURVATURE: "1"
      XRAY_DEBUG: "1"
      SCHEMA_CACHE: "0"
      NAVIGATOR_MODEL: "gemini-2.5-flash"
      NAVIGATOR_ENDPOINT: ""
      NAVIGATOR_FORMAT: ""
    cmds:
      - |
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║  X-Ray Demo — Gemini Live Agent Challenge               ║"
        echo "╠══════════════════════════════════════════════════════════╣"
        echo "║  Prerequisites:                                         ║"
        echo "║  • Chrome open with X-Ray extension installed           ║"
        echo "║  • Sidebar open (LOG + TERMINAL tabs)                   ║"
        echo "║  • GEMINI_API_KEY set                                   ║"
        echo "║  • Mic enabled for voice commands                       ║"
        echo "║                                                         ║"
        echo "║  Demo flow:                                             ║"
        echo "║  1. Navigate to a site (voice: \"go to ...\")             ║"
        echo "║  2. Watch agent ls/cat in TERMINAL tab (⚡ agent:~$)    ║"
        echo "║  3. Voice command: \"click on mache-XX\" (overlay IDs)    ║"
        echo "║  4. Toggle overlay: Cmd+Shift+X (zone segmentation)     ║"
        echo "║  5. Show GCP: task deploy-proof                         ║"
        echo "║                                                         ║"
        echo "║  Start recording, then press Enter...                   ║"
        echo "╚══════════════════════════════════════════════════════════╝"
        read -r
        ./{{.BINARY_NAME}} --voice

  golden-path:
    desc: Run golden path test (YouTube search → click → read) against running agentd
    cmds:
      - ./scripts/golden_path_test.sh {{.CLI_ARGS}}

  golden-path-loop:
    desc: Run golden path test 5x to identify flaky steps and measure latency
    cmds:
      - ./scripts/golden_path_test.sh --loop 5

  golden-loop:
    desc: Self-contained YouTube test — starts/stops agentd, logs everything, analyzes
    cmds:
      - ./scripts/golden_loop.sh {{.CLI_ARGS}}

  golden-loop-3:
    desc: 3x YouTube golden loop for flake detection + A/B comparison
    cmds:
      - ./scripts/golden_loop.sh --runs 3 {{.CLI_ARGS}}

  capture-testdata:
    desc: Capture frozen testdata from running agentd (screenshot + summary)
    cmds:
      - go run ./cmd/capture-testdata {{.CLI_ARGS}}

  analyze-replay:
    desc: Extract site primers from replay results (which tool chains win?)
    cmds:
      - go run ./cmd/analyze-replay {{.CLI_ARGS}}

  analyze-replay-emit:
    desc: Extract + write site_primers.json
    cmds:
      - go run ./cmd/analyze-replay -emit

  replay:
    desc: Offline Navigator replay — debug decisions without browser (real Gemini)
    env:
      CARTOGRAPHER_MODE: cairn
      CAIRN_SHEAF: "1"
    cmds:
      - go run ./cmd/replay {{.CLI_ARGS}}

  replay-3:
    desc: 3x offline replay for consistency check
    env:
      CARTOGRAPHER_MODE: cairn
      CAIRN_SHEAF: "1"
    cmds:
      - go run ./cmd/replay -runs 3 {{.CLI_ARGS}}

  replay-dump:
    desc: Dump what Navigator sees for replay testdata (no LLM call)
    env:
      CARTOGRAPHER_MODE: cairn
      CAIRN_SHEAF: "1"
    cmds:
      - go run ./cmd/replay -dump {{.CLI_ARGS}}

  golden:
    desc: Golden path test (Go) — full diagnostics, URLs, actions, timing
    cmds:
      - go run ./cmd/golden {{.CLI_ARGS}}

  golden-3:
    desc: 3x golden path with A/B comparison
    cmds:
      - go run ./cmd/golden -runs 3 {{.CLI_ARGS}}

  # ---------------------------------------------------------------------------
  # GCP Deployment (ko + Terraform)
  # Requires .envrc: GCP_PROJECT_ID, GCP_REGION, KO_DOCKER_REPO, TF_VAR_project_id
  # ---------------------------------------------------------------------------

  deploy:
    desc: Build image with ko, deploy to Cloud Run via Terraform
    preconditions:
      - sh: test -n "$GCP_PROJECT_ID"
        msg: "GCP_PROJECT_ID not set — source .envrc"
      - sh: test -n "$KO_DOCKER_REPO"
        msg: "KO_DOCKER_REPO not set — source .envrc"
    cmds:
      - |
        set -euo pipefail
        echo "==> Building image with ko..."
        IMAGE=$(ko build ./cmd/agentd --bare --platform=linux/amd64)
        echo "    Image: $IMAGE"
        echo ""
        echo "==> Applying Terraform..."
        cd deploy
        terraform init -input=false
        terraform apply -auto-approve -var="image=$IMAGE"
        echo ""
        echo "==> Done. Use 'task deploy-proxy' to tunnel locally."

  deploy-proxy:
    desc: Proxy Cloud Run agentd to localhost:8080 (authenticated, no public exposure)
    preconditions:
      - sh: test -n "$GCP_PROJECT_ID"
        msg: "GCP_PROJECT_ID not set — source .envrc"
    cmds:
      - |
        REGION="${GCP_REGION:-us-central1}"
        echo "Proxying x-ray-agentd → localhost:8080 (Ctrl-C to stop)"
        echo "Extension connects to ws://localhost:8080 as usual."
        gcloud run services proxy x-ray-agentd \
          --region "$REGION" \
          --project "$GCP_PROJECT_ID" \
          --port 8080

  deploy-proof:
    desc: Print Cloud Run service info for GCP deployment proof
    preconditions:
      - sh: test -n "$GCP_PROJECT_ID"
        msg: "GCP_PROJECT_ID not set — source .envrc"
    cmds:
      - |
        REGION="${GCP_REGION:-us-central1}"
        echo "=== GCP Deployment Proof ==="
        gcloud run services describe x-ray-agentd \
          --region "$REGION" \
          --project "$GCP_PROJECT_ID" \
          --format "yaml(status.url, status.conditions, metadata.annotations)"
        echo ""
        echo "=== Ingress (should be internal-and-cloud-load-balancing) ==="
        gcloud run services describe x-ray-agentd \
          --region "$REGION" \
          --project "$GCP_PROJECT_ID" \
          --format "value(metadata.annotations[run.googleapis.com/ingress])"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
